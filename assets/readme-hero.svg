    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.42" stop-color="#111827"/>
      <stop offset="1" stop-color="#191b22"/>
